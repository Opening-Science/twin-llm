# Monthly, at most 2 open PRs per ecosystem. Every Dependabot PR is reviewed and
# merged by a maintainer only when CI is green; it never merges on its own.
version: 2
updates:
  # bun.lock at the root. packages/open-twin/ keeps the dependencies of the
  # open-twin commit it was copied from and moves with an open-twin merge
  # (docs/open-twin.md); third_party/ is pinned by SHA. Neither is bumped here.
  - package-ecosystem: bun
    directory: /
    exclude-paths:
      - "packages/open-twin/**"
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    cooldown:
      default-days: 2
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: cargo
    directory: /apps/ark/rsid-genotypes
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    cooldown:
      default-days: 2

  # Keeps the SHA pins in .github/workflows current.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    cooldown:
      default-days: 2
    groups:
      actions:
        patterns:
          - "*"
