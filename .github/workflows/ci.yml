name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - run: bun run sync:open-twin
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
        env:
          NODE_OPTIONS: --max-old-space-size=8192
          LOCAL_MVP: "true"
          AUTH_DISABLED: "true"
          DATABASE_URL: postgresql://user:pass@localhost:5432/twin_llm
          LLM_PROVIDER: ollama
          DATA_MODE: synthetic

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - run: bun run sync:open-twin
      - run: bun install --frozen-lockfile
      - run: bun run lint

  lint-claims:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - run: bun run sync:open-twin
      - run: bun install --frozen-lockfile
      - run: bun run lint:claims

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - run: bun run sync:open-twin
      - run: bun install --frozen-lockfile
      - run: bun test

  test-isolation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - run: bun run sync:open-twin
      - run: bun install --frozen-lockfile
      - run: bun run test:isolation

  prisma:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: scratch
          POSTGRES_DB: twin_llm
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d twin_llm"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:scratch@127.0.0.1:5432/twin_llm
      SHADOW_DATABASE_URL: postgresql://postgres:scratch@127.0.0.1:5432/twin_llm_shadow
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - name: Install psql
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Create shadow database
        run: |
          PGPASSWORD=scratch psql -h 127.0.0.1 -U postgres -d twin_llm \
            -c "CREATE DATABASE twin_llm_shadow;"
      - run: bun run sync:open-twin
      - run: bun install --frozen-lockfile
      - run: bun run db:generate
      - run: bun run db:verify

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # Official action requires a paid org license (GITLEAKS_LICENSE).
      # Use the OSS CLI instead — no live OAuth, no secrets in env.
      # Bump the version and its SHA-256 (from the release's checksums file) together.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -fsSL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks
          gitleaks version
      - name: Scan
        run: gitleaks detect --source . --config .gitleaks.toml --verbose --redact

  ark-app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - uses: dtolnay/rust-toolchain@5059963b1731bf1580991b5f3b1eecfb5da406c0 # 1.98.0
        with:
          toolchain: 1.98.0
          targets: wasm32-wasip1
      # Bump each version and its SHA-256 (the release asset's digest) together.
      - name: Install wasmtime
        env:
          WASMTIME_VERSION: v48.0.2
          WASMTIME_SHA256: f2b0ad1ce9253f2f9a38793c2c42cd1cba4e90b27dc40d685eaf723dc8438d94
        run: |
          curl -fsSL -o wasmtime.tar.xz "https://github.com/bytecodealliance/wasmtime/releases/download/${WASMTIME_VERSION}/wasmtime-${WASMTIME_VERSION}-x86_64-linux.tar.xz"
          echo "${WASMTIME_SHA256}  wasmtime.tar.xz" | sha256sum -c -
          tar -xJf wasmtime.tar.xz
          sudo mv "wasmtime-${WASMTIME_VERSION}-x86_64-linux/wasmtime" /usr/local/bin/wasmtime
          wasmtime --version
      - name: Install wasm-opt
        env:
          BINARYEN_VERSION: version_132
          BINARYEN_SHA256: 195ddc94f9bc89f45abdabb0b9eea86023d727ba90eac8b35b80f2544fc30572
        run: |
          curl -fsSL -o binaryen.tar.gz "https://github.com/WebAssembly/binaryen/releases/download/${BINARYEN_VERSION}/binaryen-${BINARYEN_VERSION}-x86_64-linux.tar.gz"
          echo "${BINARYEN_SHA256}  binaryen.tar.gz" | sha256sum -c -
          tar -xzf binaryen.tar.gz
          sudo mv "binaryen-${BINARYEN_VERSION}/bin/wasm-opt" /usr/local/bin/wasm-opt
          wasm-opt --version
      - run: bun run ark:build
      - run: bun run ark:test
